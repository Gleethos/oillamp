# Outbound SSH from inside the sandbox goes through the egress proxy, because there is no route
# out of this container and no DNS. Without this, `git clone git@…` fails with a name-resolution
# error that tells the agent nothing about why.
#
# The negative pattern matters: connections to the lamp itself must not be proxied through it.
Host * !lamp-*
  ProxyCommand socat - PROXY:127.0.0.1:%h:%p,proxyport=3128
