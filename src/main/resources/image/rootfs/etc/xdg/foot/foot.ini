# The sandbox's terminal, in the same colours as the desktop and its window frames
# (/etc/oillamp/sway/config): slate background, the lamp's brass as the accent. The shell prompt
# is ANSI yellow, so it comes out brass here.
#
# This replaces Debian's commented-out default. A ~/.config/foot/foot.ini of the agent's own
# takes precedence over it.

[main]
font=DejaVu Sans Mono:size=10
pad=12x10

[cursor]
color=1b1f2a f3cf7e

[colors]
foreground=d8dce6
background=1b1f2a
selection-foreground=eef0f5
selection-background=3d4556
urls=f3cf7e
regular0=2a303c
regular1=e06c75
regular2=a3c97a
regular3=d9a24a
regular4=6ea8e0
regular5=c792ea
regular6=5fb8c2
regular7=c5cad6
bright0=5c6577
bright1=ef8a92
bright2=bfe09a
bright3=f3cf7e
bright4=8fc1f0
bright5=d8aef5
bright6=83d0d8
bright7=eef0f5
