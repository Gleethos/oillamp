<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <!-- The source of wallpaper.png. The background is the colour sway fills the rest of the
       screen with, and every glow fades out well inside the edges, so there is no seam at any
       screen size. Light comes from the flame, top left of the lamp. -->
  <defs>
    <!-- Bell-shaped and in many small steps, so the glow's slope never changes suddenly and
         flattens to nothing at its edge. A gradient with a few stops shows each stop as a ring
         on a large screen. -->
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(232 250) scale(390 350)">
      <stop offset="0.000" stop-color="#ffc56b" stop-opacity="0.3400"/>
      <stop offset="0.042" stop-color="#fcc167" stop-opacity="0.3364"/>
      <stop offset="0.083" stop-color="#fabd62" stop-opacity="0.3257"/>
      <stop offset="0.125" stop-color="#f7b95e" stop-opacity="0.3085"/>
      <stop offset="0.167" stop-color="#f4b559" stop-opacity="0.2860"/>
      <stop offset="0.208" stop-color="#f2b155" stop-opacity="0.2593"/>
      <stop offset="0.250" stop-color="#efac50" stop-opacity="0.2298"/>
      <stop offset="0.292" stop-color="#eda84c" stop-opacity="0.1991"/>
      <stop offset="0.333" stop-color="#eaa447" stop-opacity="0.1685"/>
      <stop offset="0.375" stop-color="#e7a043" stop-opacity="0.1391"/>
      <stop offset="0.417" stop-color="#e59c3f" stop-opacity="0.1120"/>
      <stop offset="0.458" stop-color="#e2983a" stop-opacity="0.0878"/>
      <stop offset="0.500" stop-color="#df9436" stop-opacity="0.0669"/>
      <stop offset="0.542" stop-color="#dd9031" stop-opacity="0.0495"/>
      <stop offset="0.583" stop-color="#da8c2d" stop-opacity="0.0354"/>
      <stop offset="0.625" stop-color="#d98a2b" stop-opacity="0.0245"/>
      <stop offset="0.667" stop-color="#d98a2b" stop-opacity="0.0162"/>
      <stop offset="0.708" stop-color="#d98a2b" stop-opacity="0.0103"/>
      <stop offset="0.750" stop-color="#d98a2b" stop-opacity="0.0061"/>
      <stop offset="0.792" stop-color="#d98a2b" stop-opacity="0.0034"/>
      <stop offset="0.833" stop-color="#d98a2b" stop-opacity="0.0017"/>
      <stop offset="0.875" stop-color="#d98a2b" stop-opacity="0.0007"/>
      <stop offset="0.917" stop-color="#d98a2b" stop-opacity="0.0003"/>
      <stop offset="0.958" stop-color="#d98a2b" stop-opacity="0.0000"/>
      <stop offset="1.000" stop-color="#d98a2b" stop-opacity="0.0000"/>
    </radialGradient>
    <radialGradient id="pool" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(330 432) scale(330 26)">
      <stop offset="0" stop-color="#ffb65c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb65c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(560 434) scale(170 11)">
      <stop offset="0" stop-color="#0b0d12" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0b0d12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brass" x1="300" y1="290" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3cf7e"/>
      <stop offset="0.35" stop-color="#d9a24a"/>
      <stop offset="0.75" stop-color="#9c6424"/>
      <stop offset="1" stop-color="#5e3a15"/>
    </linearGradient>
    <linearGradient id="brassDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c88f3d"/>
      <stop offset="1" stop-color="#5a3713"/>
    </linearGradient>
    <!-- For the round, turned parts (lid, knob, foot): lit on the side facing the flame and
         darkening around the curve away from it. -->
    <linearGradient id="turned" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98238"/>
      <stop offset="0.22" stop-color="#f5d892"/>
      <stop offset="0.5" stop-color="#c89040"/>
      <stop offset="0.85" stop-color="#704619"/>
      <stop offset="1" stop-color="#4e2f10"/>
    </linearGradient>
    <linearGradient id="turnedDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a24"/>
      <stop offset="0.22" stop-color="#c99447"/>
      <stop offset="0.6" stop-color="#7a4d1c"/>
      <stop offset="1" stop-color="#3e250c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff3d0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff8a1f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e2561a"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ff9a2e"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#ffe29a"/>
    </linearGradient>
    <radialGradient id="flameBase" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fb4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3b6fd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#1f2430"/>

  <g transform="translate(138 70)">
    <!-- the light the flame throws: into the room, and onto the surface the lamp stands on -->
    <rect x="-138" y="-70" width="1200" height="700" fill="url(#glow)"/>
    <rect x="-138" y="-70" width="1200" height="700" fill="url(#pool)"/>
    <rect x="-138" y="-70" width="1200" height="700" fill="url(#shadow)"/>

    <!-- handle, behind the body -->
    <path d="M598 336 C650 318 692 334 690 366 C688 396 652 404 618 392"
          fill="none" stroke="url(#brassDark)" stroke-width="15" stroke-linecap="round"/>
    <path d="M606 334 C648 322 680 334 682 358"
          fill="none" stroke="#f3cf7e" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

    <!-- foot: a narrow waist under the body, flaring out to a ring that stands on the surface -->
    <path d="M466 404 C472 410 478 412 478 416 C478 421 460 424 446 427 L446 432
             C470 438 530 438 554 432 L554 427 C540 424 522 421 522 416 C522 412 528 410 534 404 Z"
          fill="url(#turned)"/>
    <path d="M446 432 C470 438 530 438 554 432 L554 434 C530 440 470 440 446 434 Z" fill="url(#turnedDark)"/>
    <path d="M447 427.5 C470 432.5 530 432.5 553 427.5" fill="none" stroke="#fbe3a6" stroke-opacity="0.55"
          stroke-width="1.2"/>
    <!-- the shadow the body casts onto the top of the waist -->
    <ellipse cx="500" cy="410" rx="30" ry="4" fill="#24160a" opacity="0.5" filter="url(#soften)"/>

    <!-- body and spout in one piece -->
    <path d="M226 300
             C228 296 236 296 242 300
             C282 318 336 330 392 330
             C426 304 574 300 612 330
             C642 356 626 396 566 406
             C530 412 470 412 434 406
             C410 402 390 392 378 380
             C330 368 278 344 236 318
             C228 313 224 306 226 300 Z"
          fill="url(#brass)"/>
    <!-- the rim of the body, catching the light -->
    <path d="M396 332 C432 312 568 308 606 332" fill="none" stroke="url(#sheen)" stroke-width="3" stroke-linecap="round"/>
    <path d="M246 304 C286 321 338 332 390 334" fill="none" stroke="#fff3d0" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
    <!-- the flame's reflection on the shoulder of the body -->
    <path d="M404 350 C424 338 470 332 510 334" fill="none" stroke="#fff4d6" stroke-opacity="0.55"
          stroke-width="5" stroke-linecap="round" filter="url(#soften)"/>
    <!-- a thin band around the body -->
    <path d="M388 374 C440 390 566 390 622 368" fill="none" stroke="#4a2d10" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- the opening in the top of the body, with a raised collar the lid sits in -->
    <ellipse cx="500" cy="318" rx="47" ry="6.5" fill="url(#turnedDark)"/>
    <ellipse cx="500" cy="317.5" rx="44" ry="5" fill="#3e250c"/>

    <!-- lid: a low dome with a lip, a short neck and a knob, all one turned piece -->
    <path d="M459 317 C460 301 478 293 500 293 C522 293 540 301 541 317 C528 321.5 472 321.5 459 317 Z"
          fill="url(#turned)"/>
    <path d="M457 316.5 C472 321.5 528 321.5 543 316.5 L543 319 C528 324.5 472 324.5 457 319 Z"
          fill="url(#turnedDark)"/>
    <path d="M466 309 C469 302 478 297 488 295.5" fill="none" stroke="#fff4d6" stroke-opacity="0.6"
          stroke-width="2.5" stroke-linecap="round" filter="url(#soften)"/>
    <path d="M495.5 294 C497 291 497 289 495.5 286.5 L504.5 286.5 C503 289 503 291 504.5 294 Z"
          fill="url(#turnedDark)"/>
    <path d="M500 268 C503 274 510 278 510 282.5 C510 286.5 505.5 288 500 288 C494.5 288 490 286.5 490 282.5
             C490 278 497 274 500 268 Z" fill="url(#turned)"/>
    <ellipse cx="495.5" cy="280.5" rx="1.8" ry="3.2" fill="#fff4d6" opacity="0.7"/>

    <!-- wick -->
    <path d="M229 300 L233 284 L239 286 L237 302 Z" fill="#2a1d12"/>

    <!-- flame: a soft halo, then three layers from the hot white core outwards, leaning a
         little as a real flame does -->
    <g transform="translate(236 288)">
      <path d="M4 -132 C14 -100 38 -74 36 -40 C34 -12 18 2 0 2 C-18 2 -35 -12 -35 -40 C-35 -72 -8 -92 4 -132 Z"
            fill="#ff9b33" opacity="0.55" filter="url(#halo)"/>
      <path d="M5 -130 C8 -104 32 -82 32 -44 C32 -16 17 0 0 0 C-17 0 -31 -16 -31 -42 C-31 -74 -4 -90 5 -130 Z"
            fill="url(#flameOuter)" filter="url(#soften)"/>
      <path d="M4 -106 C7 -86 24 -66 24 -38 C24 -16 12 -5 0 -5 C-12 -5 -23 -16 -23 -36 C-23 -60 -3 -76 4 -106 Z"
            fill="url(#flameMid)" filter="url(#soften)"/>
      <path d="M2 -70 C4 -56 13 -46 13 -30 C13 -18 7 -11 0 -11 C-7 -11 -12 -18 -12 -29 C-12 -44 -1 -52 2 -70 Z"
            fill="url(#flameCore)" filter="url(#soften)"/>
      <ellipse cx="0" cy="-6" rx="9" ry="7" fill="url(#flameBase)"/>
    </g>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#8e97ab" fill-opacity="0.55"
        font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" letter-spacing="10">oillamp</text>
</svg>
