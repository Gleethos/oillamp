# Renders every specification as Markdown under build/spock-reports, reportInfo text included,
# so the scenarios can be read as documentation without opening the source.
com.athaydes.spockframework.report.IReportCreator=com.athaydes.spockframework.report.template.TemplateReportCreator
com.athaydes.spockframework.report.outputDir=build/spock-reports
com.athaydes.spockframework.report.hideEmptyBlocks=true
