import java.time.Duration

plugins {
    id 'java'
    id 'groovy'
    id 'application'
    // For static null checking:
    id "net.ltgt.errorprone" version "4.2.0"
}

group = 'dev.oillamp'
version = '0.2.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dev.oillamp.OilLamp'
}

// The sandbox image's files ship inside the jar, and a jar cannot list a directory. So this task
// writes a list of them at build time, one line per file with its mode (755 or 644). The mode
// matters: an entrypoint extracted without its executable bit makes the container fail at once.
def imageManifest = tasks.register('imageManifest') {
    description = 'Lists the sandbox image resources, so they can be extracted from the jar.'
    def imageDirectory = file('src/main/resources/image')
    def manifest = layout.buildDirectory.file('generated-resources/image/MANIFEST')
    inputs.dir(imageDirectory)
    outputs.file(manifest)
    doLast {
        def target = manifest.get().asFile
        target.parentFile.mkdirs()
        target.text = fileTree(imageDirectory).files.toSorted().collect { file ->
            def relative = imageDirectory.toPath().relativize(file.toPath()).toString()
            "${file.canExecute() ? '755' : '644'} ${relative}"
        }.join('\n') + '\n'
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated-resources'))

// Genies, a desktop chat app that hosts agents in lamps (package dev.gui). It is a separate source
// set so that its user-interface libraries stay out of the oillamp single file, and it sees
// oillamp only as any other application would: through dev.lamp.
sourceSets {
    gui {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    guiImplementation.extendsFrom(implementation)
    guiRuntimeOnly.extendsFrom(runtimeOnly)
    testImplementation.extendsFrom(guiImplementation)
}
tasks.named('processResources') { dependsOn(imageManifest) }

dependencies {
    errorprone "com.uber.nullaway:nullaway:0.12.15"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    errorprone "com.google.errorprone:error_prone_core:2.45.0"
    implementation group: 'com.google.errorprone', name: 'error_prone_annotations', version: '2.45.0'
    implementation group: 'org.jspecify', name: 'jspecify', version: '1.0.0'

    // Persistent collections: the only collection types allowed in domain records.
    implementation group: 'io.github.globaltcad', name: 'sprouts', version: '2.8.0'
    // Sprouts pulls slf4j-api, which prints a "no providers found" warning on every run.
    // oillamp deliberately has no logging framework - it reports through LampEvent - so give
    // slf4j a no-op binding rather than letting it talk to the user.
    runtimeOnly group: 'org.slf4j', name: 'slf4j-nop', version: '2.0.17'

    // TOML for oillamp.toml, JSON for lamp.json and podman's output.
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.20.0'
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-toml', version: '2.20.0'

    // Genies: declarative Swing, and a look-and-feel that looks at home on a modern desktop.
    guiImplementation group: 'io.github.globaltcad', name: 'swing-tree', version: '1.0.0'
    guiImplementation group: 'com.formdev', name: 'flatlaf', version: '3.6.1'
    // Its fonts, bundled, so Genies looks the same whatever font the desktop is set to.
    guiImplementation group: 'com.formdev', name: 'flatlaf-fonts-inter', version: '4.1'
    guiImplementation group: 'com.formdev', name: 'flatlaf-fonts-jetbrains-mono', version: '2.304'
    guiImplementation group: 'com.formdev', name: 'flatlaf-fonts-roboto-mono', version: '3.000'
    testImplementation sourceSets.gui.output

    // Test dependencies! : Groovy & Spock
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'  // needed since gradle 9
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:6.0.3' // Spock needs this engine
    testImplementation "org.apache.groovy:groovy:5.0.6"
    testImplementation "org.spockframework:spock-core:2.4-groovy-5.0"
    testImplementation 'org.apache.groovy:groovy-json:5.0.6'

    // Gives specifications `reportInfo`, and renders it into build/spock-reports, so the
    // "why does this scenario exist" text is readable outside the source.
    testImplementation('com.athaydes:spock-reports:2.5.1-groovy-4.0') {
        // It is built against Groovy 4 and Spock 2.3; exclude those so this project's own
        // Groovy 5 and Spock 2.4 are used, but keep the rest, which the report renderer needs.
        exclude group: 'org.codehaus.groovy'
        exclude group: 'org.apache.groovy'
        exclude group: 'org.spockframework'
    }
    // The report renderer builds its pages with GStringTemplateEngine, which lives here.
    testImplementation 'org.apache.groovy:groovy-templates:5.0.6'

    // Used by TheShapeOfTheCodeSpec to check the public types and which classes may do I/O.
    testImplementation group: 'com.tngtech.archunit', name: 'archunit', version: '1.4.1'
}

// The license goes inside every jar, so it goes along wherever the jar does.
tasks.withType(Jar).configureEach {
    from('LICENSE') { into('META-INF') }
}

tasks.withType(JavaCompile) {
    options.errorprone { // list of bug patterns https://errorprone.info/bugpatterns
        check("NullAway", name.toLowerCase(Locale.ROOT).contains("test") ? net.ltgt.gradle.errorprone.CheckSeverity.WARN : net.ltgt.gradle.errorprone.CheckSeverity.ERROR)  // remove the if condition if you want to run NullAway on test code
        option("NullAway:AnnotatedPackages", "dev.oillamp,dev.lamp,dev.gui")
    }
    options.compilerArgs += ['--should-stop=ifError=FLOW', '-Xlint:all,-serial,-processing']
    options.errorprone.disable("StringConcatToTextBlock") // Workaround for: https://github.com/google/error-prone/issues/4918#issuecomment-2952215463
}

tasks.register('genies', JavaExec) {
    group = 'application'
    description = 'Starts Genies, the chat app whose agents each live in a lamp.'
    classpath = sourceSets.gui.runtimeClasspath
    mainClass = 'dev.gui.Genies'
}

// The default `test` task must stay fast, offline and deterministic: it runs entirely against
// Machine.simulated(), so it works on any machine and in CI with no podman and no network.
test {
    useJUnitPlatform {
        excludeTags 'spike'
    }
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

// The spikes are the opposite kind of test. Each one checks an assumption about a third-party
// tool (podman, sway, wayvnc, sshd) that the simulation cannot confirm, because the simulation
// only knows what we already believed. They pull images and start containers, so they are slow
// and need a network. They are a separate task so that `build` stays fast and passes without
// podman.
tasks.register('spikes', Test) {
    group = 'verification'
    description = 'Checks assumptions about podman, sway, wayvnc and sshd against the real tools. Needs podman.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'spike'
    }
    // A spike that silently passes because it never ran is worse than no spike at all.
    filter { failOnNoMatchingTests = true }
    systemProperty 'com.athaydes.spockframework.report.outputDir', 'build/spike-reports'
    outputs.upToDateWhen { false }
    testLogging {
        events "passed", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
    timeout = Duration.ofMinutes(30)
}


// ─────────────────────────────────────────────────────────────────────────────────────────────
// Packaging: one file that contains the program and the Java runtime it needs.
//
// The result is `build/dist/oillamp`: an executable of about 40 MB that can be copied to a machine
// without Java and run there. It is a shell script with a compressed archive attached;
// `src/packaging/launcher.sh` is that script, and it is meant to be read.
//
// A `.deb` package was planned originally. It was not built, because a `.deb` must be installed
// as root and only suits Debian-family systems. See docs/DECISIONS.md.
// ─────────────────────────────────────────────────────────────────────────────────────────────

// Gradle 9 removed `exec {}` and `copy {}` from inside task actions; the supported way to reach
// them is to have Gradle inject the services. This holder exists only to be injected into.
interface PackagingServices {
    @javax.inject.Inject ExecOperations getExec()
    @javax.inject.Inject FileSystemOperations getFiles()
}

// Determined with `jdeps --print-module-deps` and pinned here, because a runtime that silently
// grows whenever a dependency changes is a runtime nobody can reason about. java.desktop arrives
// through Sprouts, java.sql through Jackson. jdk.charsets is added by hand: jdeps cannot see it,
// because character sets are loaded by name at run time, and without it a lamp path containing a
// character outside the default set would fail to read.
def runtimeModules = 'java.base,java.desktop,java.sql,jdk.charsets'

def jdkHome = providers.provider {
    extensions.getByType(JavaToolchainService)
             .launcherFor(java.toolchain).get()
             .metadata.installationPath.asFile.absolutePath
}

def jlinkRuntime = tasks.register('jlinkRuntime') {
    group = 'distribution'
    description = 'Builds the cut-down Java runtime that ships inside the single file.'
    def services = objects.newInstance(PackagingServices)
    def output = layout.buildDirectory.dir('oillamp-runtime')
    def modules = runtimeModules
    def home = jdkHome
    inputs.property('modules', modules)
    inputs.property('jdk', home)
    outputs.dir(output)
    doLast {
        def target = output.get().asFile
        services.files.delete { delete(target) }
        services.exec.exec {
            commandLine "${home.get()}/bin/jlink",
                    '--add-modules', modules,
                    '--strip-debug', '--no-header-files', '--no-man-pages',
                    '--compress', 'zip-6',
                    '--output', target.absolutePath
        }
    }
}

tasks.register('singleFile') {
    group = 'distribution'
    description = 'Builds build/dist/oillamp - the whole program in one executable file.'
    dependsOn(jlinkRuntime)
    def services = objects.newInstance(PackagingServices)
    def launcherSource = file('src/packaging/launcher.sh')
    def runtimeDirectory = layout.buildDirectory.dir('oillamp-runtime')
    def staging = layout.buildDirectory.dir('package')
    def result = layout.buildDirectory.file('dist/oillamp')
    def libraries = configurations.runtimeClasspath
    def applicationJar = tasks.named('jar').flatMap { it.archiveFile }
    def theVersion = version.toString()
    def modules = runtimeModules
    inputs.file(launcherSource)
    inputs.dir(runtimeDirectory)
    inputs.files(libraries)
    inputs.file(applicationJar)
    outputs.file(result)
    doLast {
        def stage = staging.get().asFile
        services.files.delete { delete(stage) }
        def payload = new File(stage, 'payload')
        // The layout the launcher expects: runtime/bin/java, and every jar in lib/.
        services.files.copy { from(runtimeDirectory); into(new File(payload, 'runtime')) }
        services.files.copy { from(libraries); from(applicationJar); into(new File(payload, 'lib')) }

        def archive = new File(stage, 'payload.tar.gz')
        services.exec.exec {
            // --sort=name and a fixed timestamp make the archive byte-for-byte reproducible, so
            // the same source produces the same fingerprint, and rebuilding without changing
            // anything does not invalidate everyone's unpacked copy.
            commandLine 'tar', '--sort=name', '--mtime=@0', '--owner=0', '--group=0',
                        '--numeric-owner', '-czf', archive.absolutePath,
                        '-C', payload.absolutePath, '.'
        }

        def fingerprint = java.security.MessageDigest.getInstance('SHA-256')
                              .digest(archive.bytes).encodeHex().toString().substring(0, 16)
        def preamble = launcherSource.text
                            .replace('@VERSION@', theVersion)
                            .replace('@FINGERPRINT@', fingerprint)

        def target = result.get().asFile
        target.parentFile.mkdirs()
        target.withOutputStream { out ->
            out.write(preamble.getBytes('UTF-8'))
            archive.withInputStream { it.transferTo(out) }
        }
        target.setExecutable(true, false)
        logger.lifecycle("built ${target} " +
                "(${(target.length() / 1024 / 1024).setScale(1, java.math.RoundingMode.HALF_UP)} MB" +
                ", fingerprint ${fingerprint}, modules ${modules})")
    }
}
